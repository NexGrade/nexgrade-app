kind = "web"
previewPath = "/"
title = "Horário Escolar"
version = "1.0.0"
id = "artifacts/horario-escolar"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24524

[services.development]
run = "pnpm --filter @workspace/horario-escolar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/horario-escolar", "run", "build" ]
publicDir = "artifacts/horario-escolar/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24524"
BASE_PATH = "/"
